<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password — Argus</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <h2>Set a new password</h2>
    <p style="font-size:14px;color:var(--muted);margin-bottom:20px">
      You signed in with a temporary password set by your administrator.
      You must set a permanent password before you can continue.
    </p>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <form method="post">
      <div class="form-group">
        <label class="lbl">New password</label>
        <input type="password" name="new_password" autofocus autocomplete="new-password"
               minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="form-group">
        <label class="lbl">Confirm new password</label>
        <input type="password" name="confirm" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Set password</button>
    </form>
  </div>
</div>
</body>
</html>
